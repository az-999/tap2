apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "tap-php.fullname" . }}-nginx
  labels:
    {{- include "tap-php.labels" . | nindent 4 }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "tap-php.selectorLabels" . | nindent 6 }}
      app: php-fpm-nginx

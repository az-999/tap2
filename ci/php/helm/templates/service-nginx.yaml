apiVersion: v1
kind: Service
metadata:
  name: {{ include "tap-php.fullname" . }}-nginx
  labels:
    {{- include "tap-php.labels" . | nindent 4 }}
    app: php-fpm-nginx
spec:
  type: {{ .Values.nginx.service.type }}
  ports:
    - port: {{ .Values.nginx.service.port }}
      targetPort: http
      protocol: TCP
      name: http
{{- if and .Values.metrics.enabled .Values.metrics.nginx.enabled }}
    - port: {{ .Values.metrics.nginx.port }}
      name: metrics
      targetPort: metrics
      protocol: TCP
{{- end }}
  selector:
    {{- include "tap-php.selectorLabels" . | nindent 4 }}
    app: php-fpm-nginx

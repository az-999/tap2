version: "3.5"

services:
  memcached2:
    image: memcached:alpine
    restart: always
    container_name: memcached2
    ports:
      - "11213:11211"

  phpmyadmin2:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin2
    restart: always
    links:
      - mysql2
      - mysql-log2
    depends_on:
      - mysql2
      - mysql-log2
    ports:
      - "127.0.0.1:8091:80"
    environment:
      PMA_HOST: mysql2

  mysql2:
    image: mysql:8.0
    command: "--default-authentication-plugin=mysql_native_password --skip-log-bin"
    container_name: mysql2
    restart: always
    volumes:
      - /home/develop/mysql2:/var/lib/mysql
    ports:
      - "3316:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=password
      - MYSQL_DATABASE=tap

  mysql-log2:
    image: mysql:8.0
    command: "--default-authentication-plugin=mysql_native_password --skip-log-bin"
    container_name: mysql-log2
    restart: always
    volumes:
      - /home/develop/mysql-log2:/var/lib/mysql
    ports:
      - "3317:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=password
      - MYSQL_DATABASE=tap-log

  front2:
    image: ${FRONT_IMAGE}:${VERSION}
    container_name: front2
    ports:
      - 8092:3000
    environment:
      - REACT_APP_MODE=test
      - REACT_APP_API_URL=https://api.test.mmbump.pro
      - REACT_APP_WSS_URL=wss://dev8.usmykyta.pro/connection/websocket
      - REACT_APP_TON_API_URL=https://tonapi.io/v2
      - REACT_APP_TAP_TONAPI_URL=https://apiton.test2.mmbump.pro
      - REACT_APP_TRANSACTION_NFT_LIFE_TIME=600
      - REACT_APP_FARMING_PERIOD=30
      - REACT_APP_APITON_URL=https://apiton.test2.mmbump.pro

  ton2:
    image: ${TON_IMAGE}:${VERSION}
    container_name: ton2
    ports:
      - 8093:3000
    environment:
      - API_URL=https://api.test2.mmbump.pro
      - JWT_SECRET=15BVK0mpY21qoH98l7BvE1XiUR132Avubg0tmxm8HThTfnVpUxCkFpuiVGZttdf3
      - COLLECTION_ADDRESS_NFT1=EQBqqjvW9DKAinL7eKie6ScozUWCu4Z0Uod5abtrbql58q_E
      # - COLLECTION_ADDRESS_NFT1=EQBj8gH_-06qjngcQT4qFckB4ozueOqIOUqIZ6UslwNoj8zX
      - COLLECTION_ADDRESS_NFT2=EQCTwN6lQNicNIVJPga9d2FCS2DdAvvQb8vFD1eS4_dcv_RZ
      - COLLECTION_ADDRESS_NFT3=EQCamaf-BiHae4rtNcc2UK-vCsHguu1PkQ3Odq1DllwCsjPb
      - COLLECTION_ADDRESS_NFT4=EQCWobuqCICbdaDlhm1L-55PC9UwynLPs8Xurs-EwjKeX-xM

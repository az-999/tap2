      - DB_LOG_WRITE_HOST=mysql-log2
      - DB_LOG_READ_HOST_LIST=mysql-log2
      - DB_LOG_PORT=3306
      - DB_LOG_DATABASE=tap-log
      - DB_LOG_USERNAME=root

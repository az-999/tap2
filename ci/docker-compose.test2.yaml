      - SESSION_DRIVER=memcached
      - LOG_CHANNEL=stderr
      - MEMCACHED_HOST=memcached2
      - TELEGRAM_BOT_TOKEN=7368536629:AAE8xv7mhr-KIPszL4T0BEySjtLMn4OTpRg

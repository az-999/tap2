      - APP_NFT_URL=https://apiton.test2.mmbump.pro
      - REQ_SIGN_KEY=super-key

  php-nginx2:
    container_name: php-nginx2
    depends_on:
      - php-fpm2
    image: ${NGINX_IMAGE}:${VERSION}
    ports:
      - 8090:80
    links:
      - php-fpm2
    environment:
      - PHP_HOST=php-fpm2
      - NGINX_RESOLVER=127.0.0.11

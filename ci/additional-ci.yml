.rules_develop_always:
  - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH && $CI_COMMIT_TAG == null
    when: always

.rules_develop_success:
  - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH && $CI_COMMIT_TAG == null
    when: on_success

.rules_develop_manual:
  - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH && $CI_COMMIT_TAG == null
    when: manual

.rules_develop_test_run:
  - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH && $CI_COMMIT_TAG == null && $CI_COMMIT_MESSAGE =~ $TEST_ENV
    when: on_success

.rules_tags_always:
  - if: $CI_COMMIT_TAG != null && $CI_COMMIT_TAG =~ /^v.*$/
    when: always

.rules_tags_success:
  - if: $CI_COMMIT_TAG != null && $CI_COMMIT_TAG =~ /^v.*$/
    when: on_success

.script_before_docker_login:
  - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY_IMAGE --username $CI_REGISTRY_USER --password-stdin

.script_before_docker_logout:
  - docker logout $CI_REGISTRY_IMAGE

.script_before_docker_version:
  - if [ -z "$CI_COMMIT_TAG" ]; then export VERSION="$CI_COMMIT_SHORT_SHA" ; else export VERSION="$CI_COMMIT_TAG" ; fi

.build:
  image: docker:24.0-cli
  services:
    - docker:24.0.5-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  tags:
    - docker
    - htz
  rules:
    - !reference [.rules_develop_always]
    - !reference [.rules_tags_always]
  before_script:
    - !reference [.script_before_docker_login]
    - !reference [.script_before_docker_version]
  script:
    - docker buildx build --push --tag $CI_REGISTRY_IMAGE/$APP_NAME:$VERSION -f ci/$COMPONENT_NAME/docker/$DOCKER_NAME.Dockerfile .
  after_script:
    - !reference [.script_before_docker_logout]

.build_front:
  image: docker:24.0-cli
  services:
    - docker:24.0.5-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  tags:
    - docker
    - htz
  before_script:
    - !reference [.script_before_docker_login]
    - !reference [.script_before_docker_version]
    - echo $ENV_FRONT | base64 -d > react/.env
  script:
    - docker buildx build --push --tag $CI_REGISTRY_IMAGE/$APP_NAME:$VERSION -f ci/$COMPONENT_NAME/docker/$DOCKER_NAME.Dockerfile .
  after_script:
    - rm react/.env
    - !reference [.script_before_docker_logout]

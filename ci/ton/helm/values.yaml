# Default values for tap-ton.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: registry.gitlab.com/mmpro1/tap/ton
  pullPolicy: IfNotPresent
  tag: "develop"

imagePullSecrets:
  - name: docker

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: apiton.mmbump.pro
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
    - hosts:
        - apiton.mmbump.pro
      secretName: le-apiton-mmbump-pro

resources:
  limits:
    cpu: 1
    memory: 1Gi
  requests:
    cpu: 100m
    memory: 256Mi

livenessProbe:
  successThreshold: 1
  tcpSocket:
    port: 3000
  failureThreshold: 5
  periodSeconds: 10

readinessProbe:
  successThreshold: 1
  tcpSocket:
    port: 3000
  failureThreshold: 1
  periodSeconds: 10

startupProbe:
  terminationGracePeriodSeconds: 20
  successThreshold: 1
  initialDelaySeconds: 20
  tcpSocket:
    port: 3000
  failureThreshold: 30
  periodSeconds: 10

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

customSecrets:
  - name: JWT_SECRET
    valueFrom:
      secretKeyRef:
        name: custom-env-fpm
        key: JWT_SECRET

envFrom:
  - secretRef:
      name: custom-ton

nodeSelector:
  k8s.scaleway.com/type: worker

tolerations: []

affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
    - weight: 1
      preference:
        matchExpressions:
        - key: app
          operator: In
          values:
            - tap-ton
env:
  COLLECTION_ADDRESS_NFT1: "EQC5XhGLN5wkEQcifzsiyOpPvDfAqLBzQwsfEEZVRS7LAxGJ"
  COLLECTION_ADDRESS_NFT2: "EQCLxOtUQ7ouyNdqnzxcGuChtqxcbLKqxRsRmUKsQZnjwhDb"
  COLLECTION_ADDRESS_NFT3: "EQDCU3jFPifA0MoptBDqyS4Td8TKuNN4Mw1N-AW_VGHKzzFK"
  COLLECTION_ADDRESS_NFT4: "EQD1NhcBmbVgNYFRMtlSDVdWcwQTmvV4YNkFSydD3FaOPQpw"
  COLLECTION_ADDRESS_NFT5: "EQCv9ZPdQ9LQrnlWbgQ7btD5qgyzi1uWqb9trgNmdSL1ei5l"
  API_URL: "https://api.mmbump.pro"
  NETWORK: "mainnet"

cronJob:
  enabled: true
  schedule: "0 */12 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 4
  concurrencyPolicy: "Forbid"
  name: "ton-send"
  args:
    - yarn
    - ts-node
    - ./sources/console/sendTon.ts

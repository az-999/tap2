apiVersion: v1
kind: Service
metadata:
  name: {{ include "tap-front.fullname" . }}
  labels:
    {{- include "tap-front.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
{{- if .Values.monitoring.enabled }}
    - port: {{ .Values.monitoring.port }}
      targetPort: metrics
      protocol: TCP
      name: metrics
{{- end }}
  selector:
    {{- include "tap-front.selectorLabels" . | nindent 4 }}
    app: tap-front

      - APP_NFT_PRICE=80000000
      - APP_NFT_URL=https://apiton.test.mmbump.pro
      - REQ_SIGN_KEY=super-key

  php-nginx:
    container_name: php-nginx
    depends_on:
      - php-fpm
    image: ${NGINX_IMAGE}:${VERSION}
    ports:
      - 8080:80
    links:
      - php-fpm
    environment:
      - PHP_HOST=php-fpm
      - NGINX_RESOLVER=127.0.0.11

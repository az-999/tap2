version: "3.5"

services:
  memcached:
    image: memcached:alpine
    restart: always
    container_name: memcached
    ports:
      - "11211:11211"

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    restart: always
    links:
      - mysql
    depends_on:
      - mysql
    ports:
      - "127.0.0.1:8081:80"
    environment:
      PMA_HOST: mysql

  mysql:
    image: mysql:8.0
    command: "--default-authentication-plugin=mysql_native_password --skip-log-bin"
    container_name: mysql
    restart: always
    volumes:
      - /home/develop/mysql:/var/lib/mysql
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=password
      - MYSQL_DATABASE=tap

  mysql-log:
    image: mysql:8.0
    command: "--default-authentication-plugin=mysql_native_password --skip-log-bin"
    container_name: mysql_log
    restart: always
    volumes:
      - /home/develop/mysql-log:/var/lib/mysql
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=password
      - MYSQL_DATABASE=tap-log

  front:
    image: ${FRONT_IMAGE}:${VERSION}
    container_name: front
    ports:
      - 8082:3000
    environment:
      - REACT_APP_MODE=test
      - REACT_APP_API_URL=https://api.test.mmbump.pro
      - REACT_APP_WSS_URL=wss://dev8.usmykyta.pro/connection/websocket
      - REACT_APP_TON_API_URL=https://tonapi.io/v2
      - REACT_APP_TAP_TONAPI_URL=https://apiton.test.mmbump.pro
      - REACT_APP_TRANSACTION_NFT_LIFE_TIME=600
      - REACT_APP_FARMING_PERIOD=30
      - REACT_APP_APITON_URL=https://apiton.test.mmbump.pro
      - REACT_APP_BOT_USERNAME=mmbump_test_bot
      - REACT_APP_WEB_URL=https://front.test.bumpstore.app
      - REACT_APP_WEB_TEST_URL=https://front.test.bumpstore.app
      - REACT_APP_TELEGRAM_TEST_URL=https://front.test.mmbump.pro
      - REACT_APP_WEB_PROD_URL=https://bumpstore.app
      - REACT_APP_TELEGRAM_PROD_URL=https://mmbump.pro

  ton:
    image: ${TON_IMAGE}:${VERSION}
    container_name: ton
    ports:
      - 8083:3000
    environment:
      - API_URL=https://api.test.mmbump.pro
      - JWT_SECRET=15BVK0mpY21qoH98l7BvE1XiUR132Avubg0tmxm8HThTfnVpUxCkFpuiVGZttdf3
      - COLLECTION_ADDRESS_NFT1=EQBqqjvW9DKAinL7eKie6ScozUWCu4Z0Uod5abtrbql58q_E

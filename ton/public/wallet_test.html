<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">    

        <title>Wallet Test</title>
        <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
        <script src="https://unpkg.com/tonweb@0.0.66/dist/tonweb.js"></script>
    </head>
    <body>
        <div id="connect"></div>
        <input type="text" id="address" style="width: 100%;">
        <input type="text" id="value" style="width: 100%;" value="300000000">
        <input type="text" id="payload" style="width: 100%; height: 150px;">
        <button id="send">Send</button>
        <div id="result"></div>
        <script>
            const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
                manifestUrl: 'https://raw.githubusercontent.com/ma5ksh0w/check-manifest/refs/heads/main/manifest.json',
                buttonRootId: 'connect'
            });


            document.getElementById('send').addEventListener('click', async () => {
                const tx = {
                    validUntil: Math.floor(Date.now() / 1000) + 60,
                    messages:[{
                        address: document.getElementById('address').value,
                        amount: document.getElementById('value').value,
                        payload: document.getElementById('payload').value
                    }]
                }

                try {
                    const result = await tonConnectUI.sendTransaction(tx, {returnStrategy: 'back'});
                    const hash = await TonWeb.boc.Cell.oneFromBoc(TonWeb.utils.base64ToBytes(result.boc)).hash();
                    console.log(hash)
                    document.getElementById('result').innerText = TonWeb.utils.bytesToHex(hash);
                } catch (error) {   
                    console.log(error);
                    document.getElementById('result').innerText = `${error.message}` || error;
                }
            });
        </script>
    </body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="MMPro Farming Game" />
    <title>MMPro Farming Game</title>


    <style>
        @font-face {
            font-family: 'SF Pro Display';
            src: local('SF Pro Display Regular'), local('SF-Pro-Display-Regular'),
            url('./fonts/SF-Pro-Display-Medium.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }

        @font-face {
            font-family: 'SF Pro Display';
            src: local('SF Pro Display Semibold'), local('SF-Pro-Display-Semibold'),
            url('./fonts/SF-Pro-Display-Semibold.otf') format('opentype');
            font-weight: 600;
            font-style: normal;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0D0E0F;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100vw;
            height: 100vh;
            font-family: 'SF Pro Display', sans-serif;
        }

        .main-container {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            background-color: #151718;
            width: 100%;
            max-width: 340px;
            border-radius: 10px;
            padding: 10px;
            min-height: 210px;
            gap: 12px;
        }

        .title {
            color: #FFF;
            text-align: center;
            font-size: 16px;
            font-style: normal;
            font-weight: 600;
        }

        .paragraph {
            color: #FFF;
            text-align: center;
            font-size: 12px;
            font-style: normal;
            font-weight: 400;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <svg width="38" height="38" viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg">

        </svg>
        <h1 class="title">Technical problems</h1>
        <p class="paragraph">We’ll reward you immediately with points after completion each task</p>
    </div>
</body>
</html>

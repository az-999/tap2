version: "3.1"
services:
    memcached:
      image: memcached:alpine
      restart: always
      container_name: tap_memcached
      ports:
        - "3101:11211"

    mysql:
      image: mysql:8.0
      command: "--default-authentication-plugin=mysql_native_password --skip-log-bin"
      container_name: tap_mysql
      restart: always
      working_dir: /application
      volumes:
        - .:/application
        - ./mysql:/var/lib/mysql
      ports:
        - "3106:3306"
      environment:
        - MYSQL_ROOT_PASSWORD=password

    mysql_log:
      image: mysql:8.0
      command: "--default-authentication-plugin=mysql_native_password --skip-log-bin"
      container_name: tap_mysql_log
      restart: always
      working_dir: /application
      volumes:
        - .:/application
        - ./mysql_log:/var/lib/mysql
      ports:
        - "3107:3306"
      environment:
        - MYSQL_ROOT_PASSWORD=password

    webserver:
      image: nginx:alpine
      container_name: tap_webserver
      working_dir: /application
      restart: always
      volumes:
        - ./laravel:/application
        - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      ports:
        - "3100:80"

    php-fpm:
      build: docker/php-fpm
      container_name: tap_php_fpm
      working_dir: /application
      volumes:
        - ./docker/php-fpm/laravel-worker.conf:/etc/supervisor/conf.d/laravel-worker.conf
        - ./docker/php-fpm/php-ini-overrides.ini:/etc/php/8.1/fpm/conf.d/99-overrides.ini
        - ./laravel:/application

    ton:
      build: ton
      container_name: tap_ton
      ports:
        - '3103:3000'

    phpmyadmin:
      image: phpmyadmin/phpmyadmin
      container_name: tap_phpmyadmin
      restart: always
      ports:
        - "3108:80"
      environment:
        PMA_HOST: mysql

    phpmyadmin_log:
      image: phpmyadmin/phpmyadmin
      container_name: tap_phpmyadmin_log
      restart: always
      ports:
        - "3109:80"
      environment:
        PMA_HOST: mysql_log
